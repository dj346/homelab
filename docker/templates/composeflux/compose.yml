services:
  composeflux:
    image: ghcr.io/veerendra2/composeflux:latest@sha256:38758e71f9a1154860a7a635ab902d7b1b77bb3912855ab5b1a272ecc4af29c5
    restart: unless-stopped

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOME}/.ssh/composeflux_id_rsa:/.ssh/composeflux_id_rsa:ro
      - compose-stack:/opt/compose-stack

volumes:
  compose-stack: