services:
  composeflux:
    image: ghcr.io/veerendra2/composeflux:latest@sha256:fd3d50cc1de3fd4a9d5ba445ee3c2dda4556d8339dfcc21b59088a7636311e71
    restart: unless-stopped

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOME}/.ssh/composeflux_id_rsa:/.ssh/composeflux_id_rsa:ro
      - compose-stack:/opt/compose-stack

volumes:
  compose-stack: