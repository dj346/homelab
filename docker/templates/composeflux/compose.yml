services:
  composeflux:
    image: ghcr.io/veerendra2/composeflux:latest@sha256:1a00e37856eface87d2240f01ee449a2f759c366acaa8e5586e0e8772ab9a7ff
    restart: unless-stopped

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOME}/.ssh/composeflux_id_rsa:/.ssh/composeflux_id_rsa:ro
      - compose-stack:/opt/compose-stack

volumes:
  compose-stack: