apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vaultwarden-application
  namespace: argocd
  labels:
    app.kubernetes.io/name: vaultwarden
    app.kubernetes.io/component: application
    app.kubernetes.io/instance: vaultwarden-bootstrap-prod-d1
    app.kubernetes.io/stage: bootstrap

  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  revisionHistoryLimit: 5
  destination:
    server: https://kubernetes.default.svc
    namespace: vaultwarden-prod-d1
  sources:
    - repoURL: https://github.com/dj346/homelab.git
      targetRevision: HEAD
      path: kubernetes/apps/vaultwarden/base
    
    - repoURL: https://github.com/dj346/homelab.git
      targetRevision: HEAD
      path: kubernetes/apps/vaultwarden/bootstrap-prod-d1
      directory:
        exclude: application.yaml
    
  syncPolicy:
    syncOptions:
      - Validate=true
      - PrunePropagationPolicy=foreground
      - CreateNamespace=true
    
    automated:
      prune: true
      selfHeal: true
    
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
