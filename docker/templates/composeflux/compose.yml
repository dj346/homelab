services:
  composeflux:
    image: ghcr.io/veerendra2/composeflux:latest@sha256:fc3082e659e706a63dce7a6106ac3691f08af15ac6910e36fcf54bc9dba365f7
    restart: unless-stopped

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOME}/.ssh/composeflux_id_rsa:/.ssh/composeflux_id_rsa:ro
      - compose-stack:/opt/compose-stack

volumes:
  compose-stack: