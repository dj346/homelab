services:
  composeflux:
    image: ghcr.io/veerendra2/composeflux:latest@sha256:4ef2ca32da6b5b3bce32a4fe79831700cd1927a118bb34a6125a176d5ca64bb3
    restart: unless-stopped

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOME}/.ssh/composeflux_id_rsa:/.ssh/composeflux_id_rsa:ro
      - compose-stack:/opt/compose-stack

volumes:
  compose-stack: