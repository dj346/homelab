services:
  composeflux:
    image: ghcr.io/veerendra2/composeflux:latest@sha256:ee1bcb5faf6d86c1d8a996d2c5c4e4724d7eb9c33c1c714a7837947d12137384
    restart: unless-stopped

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOME}/.ssh/composeflux_id_rsa:/.ssh/composeflux_id_rsa:ro
      - compose-stack:/opt/compose-stack

volumes:
  compose-stack: