services:
  composeflux:
    image: ghcr.io/veerendra2/composeflux:latest@sha256:249a9297567ca50825484904b00b48b3b7f7b04970da5c5ccf6a36ffad5589e7
    restart: unless-stopped

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOME}/.ssh/composeflux_id_rsa:/.ssh/composeflux_id_rsa:ro
      - compose-stack:/opt/compose-stack

volumes:
  compose-stack: