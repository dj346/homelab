apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-ocr
  namespace: paperless
  labels:
    app.kubernetes.io/name: paperless
    app.kubernetes.io/component: ocr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless
      app.kubernetes.io/component: ocr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless
        app.kubernetes.io/component: ocr
    spec:
      containers:
        - name: gotenberg
          env:
            - name: CHROMIUM-DISABLE-JAVASCRIPT
              value: "true"
            - name: CHROMIUM_ALLOW_LIST
              value: "file:///tmp/.*"
          image: gotenberg/gotenberg:8@sha256:a16a14e1f18a71405624bc028e90d4ef50ea774c352b303639c10bf7b141f760
          ports:
            - name: gotenberg-http
              containerPort: 3000
              protocol: TCP
        - name: tika
          image: apache/tika:3.3.1.0-full@sha256:d8e6ed96260ad89307a93195a1b856102987a818ac648502f8efbaf313d32470
          ports:
            - name: tika-http
              containerPort: 9998
              protocol: TCP
      restartPolicy: Always