services:
  composeflux:
    image: ghcr.io/veerendra2/composeflux:latest@sha256:d6318f1cda55e040e6b03de0793f5bd81ca87b5b439f3a7b0b714596bedc7092
    restart: unless-stopped

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOME}/.ssh/composeflux_id_rsa:/.ssh/composeflux_id_rsa:ro
      - compose-stack:/opt/compose-stack

volumes:
  compose-stack: