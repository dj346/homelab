apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: 10.19.1
    releaseName: argocd
    namespace: argocd
    includeCRDs: true
    valuesInline:
      server:
        service:
          type: LoadBalancer