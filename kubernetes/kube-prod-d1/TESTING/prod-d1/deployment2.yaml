apiVersion: v1
kind: Pod
metadata:
  name: volume-debug
  namespace: anisonarr-prod-d1
spec:
  containers:
  - name: debug
    image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
    command: ["sh", "-c", "sleep 3600"]
    volumeMounts:
    - name: vol
      mountPath: /data
  volumes:
  - name: vol
    persistentVolumeClaim:
      claimName: test
  restartPolicy: Never
