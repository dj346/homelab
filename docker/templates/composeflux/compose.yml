services:
  composeflux:
    image: ghcr.io/veerendra2/composeflux:latest@sha256:dcc9e84ef2b2bd56fd8561c16f5a737966a2ccc991731727f362164cc2d89eb4
    restart: unless-stopped

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOME}/.ssh/composeflux_id_rsa:/.ssh/composeflux_id_rsa:ro
      - compose-stack:/opt/compose-stack

volumes:
  compose-stack: