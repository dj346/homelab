include:
  - openbao.hcl.yml

services:
  openbao:
    image: ghcr.io/openbao/openbao:2.7.0@sha256:71156a1c6623a5fa3f5e61b0c6a8ead0faf0df29a778339188443551995d1315
    container_name: openbao-prod-d1
    hostname: openbao-prod-d1
    restart: unless-stopped

    command:
      - server
      
    # ports:
    #   - "8200:8200"

    networks:
      - proxy

    labels:
      - "traefik.enable=true"

      - "traefik.tcp.routers.openbao-transit.rule=HostSNI(`openbao.openbao-transit-prod-d1.mclacken.net`)"
      - "traefik.tcp.routers.openbao-transit.entrypoints=websecure"
      - "traefik.tcp.routers.openbao-transit.tls=true"
      - "traefik.tcp.routers.openbao-transit.tls.passthrough=true"

      - "traefik.tcp.services.openbao-transit.loadbalancer.server.port=8200"

    configs:
      - source: openbao.hcl
        target: /openbao/config/openbao.hcl
        mode: "0444"

    volumes:
    - openbao-data:/openbao/file
    
    - type: bind
      source: /etc/openbao/tls/ca.crt
      target: /openbao/tls/ca.crt
      read_only: true
      bind:
        create_host_path: false

    - type: bind
      source: /etc/openbao/tls/server.crt
      target: /openbao/tls/server.crt
      read_only: true
      bind:
        create_host_path: false

    - type: bind
      source: /etc/openbao/tls/server.key
      target: /openbao/tls/server.key
      read_only: true
      bind:
        create_host_path: false

volumes:
  openbao-data:

networks:
  proxy:
    name: proxy
    external: true